[project]
name = "autofill"
version = "0.0.1"
description = "Browser-driving agent that submits structured insurance complaints to real public-record forms via Anthropic Computer Use."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Austin Nafe" }]
license = { text = "MIT" }
keywords = ["llm", "agents", "computer-use", "browser-automation", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.39",
]

[project.optional-dependencies]
# Browser automation lives in optional deps so the package installs cleanly
# in environments (like Streamlit Cloud free tier) where Chromium would
# blow the resource budget. Install with `uv sync --extra browser` locally
# to run the live Computer Use agent.
browser = [
    "playwright>=1.45",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
autofill = "autofill.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autofill"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
