name: Skyline 2025
city: San Francisco, CA
year: 2025
days: [Friday, Saturday, Sunday]
stages: [Lands End, Polo Field, Sutro, Twin Peaks]

# Artist roster — paired with each `set` below by name. Genres + blurbs feed
# the taste matcher's LLM context.
artists:
  - name: Phoebe Bridgers
    genres: [indie rock, indie folk, sad indie]
    blurb: Songwriter known for spare arrangements, dry humor, and devastating lyrics.
  - name: boygenius
    genres: [indie rock, supergroup]
    blurb: Phoebe Bridgers + Lucy Dacus + Julien Baker — three songwriters at peak form.
  - name: Mitski
    genres: [indie rock, art pop]
    blurb: Cathartic indie with theatrical performances and rangey vocals.
  - name: The National
    genres: [indie rock, baritone rock]
    blurb: Brooding adult-indie with literary lyrics and slow-build crescendos.
  - name: Big Thief
    genres: [indie folk, indie rock]
    blurb: Adrianne Lenker-led band; lyrical intimacy and odd-meter tenderness.
  - name: Wet Leg
    genres: [indie rock, post-punk revival]
    blurb: Deadpan post-punk with hook-forward, often funny songs.
  - name: Beach House
    genres: [dream pop, shoegaze adjacent]
    blurb: Lush, slow-burning dream pop; Victoria Legrand's voice as instrument.
  - name: Cigarettes After Sex
    genres: [dream pop, slowcore]
    blurb: Whispery ambient pop, mostly one tempo, deeply romantic.
  - name: Mac DeMarco
    genres: [indie rock, slacker rock]
    blurb: Lo-fi affable jangle with a wry persona.
  - name: Caribou
    genres: [electronic, dance, idm]
    blurb: Dan Snaith's emotional dance music — house meets indie-pop melancholy.
  - name: Floating Points
    genres: [electronic, idm, jazz fusion]
    blurb: Mathematical electronics that swing — pairs DJ sets with composed work.
  - name: Four Tet
    genres: [electronic, idm, ambient]
    blurb: Kieran Hebden's hypnotic, sample-driven sets — euphoric in the right room.
  - name: Jamie xx
    genres: [electronic, uk garage, house]
    blurb: Producer of warm, melancholy dance music with crossover hooks.
  - name: Burial
    genres: [electronic, post-dubstep, ambient]
    blurb: Anonymous London producer; rainy, vinyl-crackle dread you can dance to.
  - name: Vince Staples
    genres: [hip hop, west coast]
    blurb: Long Beach rapper with deadpan delivery and unconventional production.
  - name: Tyler, the Creator
    genres: [hip hop, alternative hip hop]
    blurb: Genre-roving rapper / producer with theatrical stage shows.
  - name: Kendrick Lamar
    genres: [hip hop, rap]
    blurb: Pulitzer-winning rapper; arena-grade headliner.
  - name: JID
    genres: [hip hop, rap]
    blurb: Atlanta rapper with rapid-fire technical chops.
  - name: Sons of Kemet
    genres: [jazz, afrobeat, brass]
    blurb: Tuba-led UK jazz quartet; high-energy, political, body-moving.
  - name: Makaya McCraven
    genres: [jazz, beat science]
    blurb: Chicago drummer collaging live jazz into hip-hop-adjacent records.
  - name: Idles
    genres: [post-punk, hardcore]
    blurb: Bristol post-punks; intense live shows, anti-bigotry stance, mosh-friendly.
  - name: Fontaines D.C.
    genres: [post-punk, irish rock]
    blurb: Dublin post-punk; literary, propulsive, increasingly atmospheric.
  - name: Father John Misty
    genres: [folk rock, americana]
    blurb: Josh Tillman's grandiose, ironic, deeply earnest songwriter persona.
  - name: Sufjan Stevens
    genres: [indie folk, chamber pop]
    blurb: Ornate, intimate songwriter; ranges from banjos to full orchestra.
  - name: Bon Iver
    genres: [indie folk, art pop]
    blurb: Justin Vernon project — falsetto-led, ranges from cabin folk to processed pop.
  - name: Doja Cat
    genres: [pop, hip hop, rnb]
    blurb: Pop polymath; aggressive lyricism, performance-heavy live show.
  - name: Olivia Rodrigo
    genres: [pop, pop punk]
    blurb: Confessional pop with sticky power-ballads and pop-punk pivots.
  - name: Charli XCX
    genres: [hyperpop, pop]
    blurb: PC-Music-adjacent pop maximalist; production-forward, club-ready.

