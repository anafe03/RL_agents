[project]
name = "festival-companion"
version = "0.0.1"
description = "Personalized festival schedule planner — taste-matched set picks with conflict resolution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Austin Nafe" }]
license = { text = "MIT" }
keywords = ["llm", "agents", "music", "festival", "scheduling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.39",
    "openai>=2.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
festival = "festival.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/festival"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
