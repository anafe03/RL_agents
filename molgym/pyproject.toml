[project]
name = "molgym"
version = "0.0.1"
description = "A reinforcement-learning gym for molecules — an RL agent learns to decorate a chemical scaffold to optimize drug-likeness and other properties."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Austin Nafe" }]
license = { text = "MIT" }
keywords = ["reinforcement-learning", "rl", "chemistry", "drug-discovery", "rdkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "rdkit>=2023.9",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
molgym = "molgym.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molgym"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
