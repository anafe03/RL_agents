[project]
name = "priorauth-assist"
version = "0.0.1"
description = "Agent that drafts cited prior-authorization appeals from a denial letter + de-identified patient context."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Austin Nafe" }]
license = { text = "MIT" }
keywords = ["llm", "agents", "healthcare", "prior-authorization", "rag", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.39",
    "pandas>=2.1",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
priorauth = "priorauth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priorauth"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
