[project]
name = "ptscribe"
version = "0.0.1"
description = "Ambient SOAP-note generation for PT/OT/ST visits — structured extraction from clinician transcripts with a full eval harness, hallucination detection, and run monitoring."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Austin Nafe" }]
license = { text = "MIT" }
keywords = ["llm", "healthcare", "physical-therapy", "soap-notes", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.39",
    "pandas>=2.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
ptscribe = "ptscribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptscribe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
