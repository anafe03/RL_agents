[project]
name = "tunelab"
version = "0.0.1"
description = "Post-training experiments. Fine-tune a small open model with verifiable rewards on a structured-extraction task. Reward function + eval harness + synthetic dataset."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Austin Nafe" }]
license = { text = "MIT" }
keywords = ["llm", "rl", "post-training", "grpo", "rlvr", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Heavy training stack is opt-in; CI / docs reading doesn't need torch.
# Install with `uv sync --extra train` on a GPU box.
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=2.20",
    "trl>=0.11",          # provides GRPOTrainer
    "accelerate>=0.34",
    "peft>=0.13",          # LoRA adapters for the small models
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
tunelab = "tunelab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tunelab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
